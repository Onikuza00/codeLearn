site_name: CodeLearn — Pau
site_author: Pau Crosas Batista
site_description: Documentación de aprendizaje — CSS, Frontend, Backend, GSAP, DevOps
site_url: https://codelearn.pau.dev

theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

