site_name: CodeLearn — Pau
site_author: Pau Crosas Batista
site_description: Documentación de aprendizaje — CSS, Frontend, Backend, GSAP, DevOps
site_url: https://codelearn.pau.dev

theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy

nav:
  - Inicio: index.md
  - 🗺️ Planes:
    - planning/index.md
    - Próxima Sesión: planning/aprendizaje.md
  - 🗺️ Way to Code:
    - waytoCode/index.md
    - 🎯 Ejercicio activo: waytoCode/ejercicio.md
    - 2026:
      - waytoCode/2026/index.md
      - "Mes 06 — Junio":
        - waytoCode/2026/06/index.md
        - "Semana 01 — Setup y diagnóstico":
          - 2026-06-13: waytoCode/2026/06/semana-1/2026-06-13.md
          - 2026-06-14 — Symfony WC: waytoCode/2026/06/semana-1/2026-06-14-sesion-1.md
          - 2026-06-14 — CSS intensivo: waytoCode/2026/06/semana-1/2026-06-14-sesion-2.md
        - "Semana 02 — Finde intensivo CSS":
          - 2026-06-27 — Día 1 CSS: waytoCode/2026/06/semana-2/2026-06-27.md
      - "Mes 07 — Julio":
        - waytoCode/2026/07/index.md
        - "Semana 03 — CSS & JS":
          - "Sábado 18 — CSS intensivo": waytoCode/2026/07/semana-3/2026-07-18.md
          - "Domingo 19 — Examen CSS": waytoCode/2026/07/semana-3/2026-07-19.md
        - "Semana 04 — CSS + JS":
          - "Jueves 23 — CSS Grid": waytoCode/2026/07/semana-4/2026-07-23.md
          - "Sábado 25 — Repaso CSS": waytoCode/2026/07/semana-4/2026-07-25.md
  - CSS:
    - css/index.md
    - "Selectores":
      - ":has()": css/selectores/01-has/index.md
    - "Layout":
      - css/layout/index.md
      - Flexbox:
        - css/layout/04-flexbox/index.md
        - Conceptos: css/layout/04-flexbox/conceptos.md
        - Alineación: css/layout/04-flexbox/alineacion.md
        - Items flexibles: css/layout/04-flexbox/items.md
      - Grid:
        - css/layout/05-grid/index.md
        - Conceptos: css/layout/05-grid/conceptos.md
        - Ubicación: css/layout/05-grid/ubicacion.md
        - Auto Layout: css/layout/05-grid/auto.md
    - "Responsive":
      - css/responsive/index.md
      - "Container Queries": css/responsive/02-container-queries/index.md
      - "Funciones responsive": css/responsive/funciones-responsive.md
    - "Arquitectura":
      - css/arquitectura/index.md
      - BEM: css/arquitectura/bem.md
      - "CSS Layers": css/arquitectura/03-layers/index.md
  - JS:
    - js/index.md
    - "JS Básico": js/01-basico/index.md
  - Frontend:
    - frontend/index.md
    - JS Vanilla:
      - frontend/01-js-vanilla/index.md
    - Vue:
      - frontend/02-vue/index.md
  - Backend:
    - backend/index.md
    - PHP:
      - backend/01-php/index.md
    - Symfony:
      - backend/02-symfony/index.md
      - "Bloque 01 - Web Components":
        - Arquitectura: backend/02-symfony/web-components/arquitectura.md
        - TwigComponents: backend/02-symfony/web-components/twig-components.md
        - LiveComponents: backend/02-symfony/web-components/live-components.md
        - Stimulus: backend/02-symfony/web-components/stimulus.md
  - GSAP:
    - gsap/index.md
  - DevOps:
    - devops/index.md
  - SDD:
    - sdd/index.md
    - Fases: sdd/fases.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 4
  - admonition

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/nav-toggle.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Onikuza00

copyright: Copyright &copy; 2026 Pau Crosas Batista
