site_name: CodeLearn — Pau
site_author: Pau Crosas Batista
site_description: Documentación de aprendizaje — CSS, Frontend, Backend, GSAP, DevOps, Python
site_url: https://onikuza00.github.io/codeLearn/

theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
