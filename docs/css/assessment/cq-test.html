<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CQ Test</title>
  <link rel="stylesheet" href="cq-test.css">
</head>
<body>
  <section class="showcase">
    <div class="showcase__wide">
      <article class="media-card">
        <img class="media-card__img" src="https://picsum.photos/seed/a/400/300" alt="Sample" loading="lazy">
        <div class="media-card__content">
          <h3 class="media-card__title">Card en contexto ANCHO</h3>
          <p class="media-card__desc">Cuando el contenedor mide más de 400px, la imagen y el contenido se ponen lado a lado.</p>
          <a class="media-card__link" href="#">Leer más →</a>
        </div>
      </article>
    </div>

    <div class="showcase__narrow">
      <article class="media-card">
        <img class="media-card__img" src="https://picsum.photos/seed/b/400/300" alt="Sample" loading="lazy">
        <div class="media-card__content">
          <h3 class="media-card__title">Card en contexto ESTRECHO</h3>
          <p class="media-card__desc">Cuando el contenedor mide menos de 400px, todo apilado verticalmente.</p>
          <a class="media-card__link" href="#">Leer más →</a>
        </div>
      </article>
    </div>
  </section>
</body>
</html>
