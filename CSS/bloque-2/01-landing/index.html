<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="photo">📸</div>
      <h3>Alex Rivera</h3>
      <span class="tag">Designer</span>
      <p>3 años de experiencia en UI/UX y branding.</p>
      <a href="#" class="cta">Ver perfil</a>
    </div>

    <div class="card featured">
      <div class="photo">📸</div>
      <h3>Sam Kim</h3>
      <span class="tag">Developer</span>
      <p>Full-stack con enfoque en frontend y animaciones.</p>
      <a href="#" class="cta">Ver perfil</a>
    </div>

    <div class="card">
      <div class="photo">📸</div>
      <h3>Jordi Casas</h3>
      <span class="tag">Strategist</span>
      <p>Product manager y estrategia digital.</p>
      <a href="#" class="cta">Ver perfil</a>
    </div>
  </div>

</body>
</html>
