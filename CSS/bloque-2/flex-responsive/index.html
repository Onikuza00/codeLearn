<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex + Responsive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- EJ 1: Sidebar + Content (flex:1) -->
  <section class="ej1">
    <aside class="sidebar">Sidebar fijo</aside>
    <main class="content">Contenido flexible</main>
  </section>

  <!-- EJ 2: 3 columnas iguales (flex:1 en todos) -->
  <section class="ej2">
    <div class="col">Col 1</div>
    <div class="col">Col 2</div>
    <div class="col">Col 3</div>
  </section>

  <!-- EJ 3: 50/50 que se apila en mobile -->
  <section class="ej3">
    <div class="texto">Texto a la izquierda</div>
    <div class="imagen">Imagen a la derecha</div>
  </section>
  

</body>
</html>
