<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-wrapper">
        <h1>01. Repaso Container Querys</h1>
       
        <div class="card">Card</div>
    </div>

     <div class="card-wrapper">
        <h1>02. Formulario con :has()</h1>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email">
        </div>
    </div>

    <div class="card-wrapper">
        <h1>03. CSS Nesting nativo</h1>
        <div class="card">
            <div class="card__title">Title</div>
            <div class="card__body">Body</div>
            <div class="card--featured">Featured</div>
        </div>
    </div>

    <div class="card-wrapper">
         <h1>04. Layers CSS</h1>
        <button class="btn bg-primary">Click me</button>
    </div>

    <div class="card-wrapper">
        <h1>05. Scroll Snap Vertical</h1>
        <div class="v-hero">
            <section class="v-section" style="background: #ff6b6b;">
                <h2>Sección 1</h2>
            </section>
            <section class="v-section" style="background: #feca57;">
                <h2>Sección 2</h2>
            </section>
            <section class="v-section" style="background: #48dbfb;">
                <h2>Sección 3</h2>
            </section>
            <section class="v-hero__footer">
                <p>Footer — esta no tiene snap</p>
            </section>
        </div>
    </div>
    
</body>
</html>
